# ================================================
# nginx Load Balancer Configuration
# DevOps Journey - Networking Phase Project
# Author: Asim Raza - Day 18
# ================================================

# Define backend server pool
upstream backend_apps {

    # Round-robin load balancing (default)
    # Requests distributed equally across all servers

    server 127.0.0.1:3001 weight=1;
    # App 1 - weight 1 (equal share)

    server 127.0.0.1:3002 weight=1;
    # App 2 - weight 1 (equal share)

    server 127.0.0.1:3003 weight=1;
    # App 3 - weight 1 (equal share)

    keepalive 32;
    # Keep 32 connections open to backends
    # Improves performance (no reconnect overhead)
}

# ── HTTP Server (redirects to HTTPS) ──
server {
    listen 8080;
    server_name localhost;

    # Redirect all HTTP to HTTPS
    return 301 https://$host:8443$request_uri;

    # Access log for HTTP
    access_log /var/log/nginx/project-http-access.log;
}

# ── HTTPS Server (main server) ──
server {
    listen 8443 ssl;
    server_name localhost;

    # SSL Certificate (self-signed for this project)
    ssl_certificate /home/asim_raza/DevOps-journey/02-networking/project/networking-project/nginx/ssl/server.crt;
    ssl_certificate_key /home/asim_raza/DevOps-journey/02-networking/project/networking-project/nginx/ssl/server.key;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session cache for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hide nginx version
    server_tokens off;

    # ── Rate Limiting ──
    # Defined in nginx.conf http block
    # limit_req zone=api burst=20 nodelay;

    # ── Logging ──
    access_log /var/log/nginx/project-access.log;
    error_log /var/log/nginx/project-error.log;

    # ── Health Check Endpoint ──
    location /nginx-health {
        # This checks nginx itself is running
        return 200 '{"status":"nginx-healthy","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
        access_log off;
        # access_log off = do not log health checks
        # reduces log noise from monitoring
    }

    # ── Load Balanced Application ──
    location / {
        proxy_pass http://backend_apps;
        # Forward to backend pool

        # Pass real client information to backends
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Retry on failure
        proxy_next_upstream error timeout;
        # If a backend fails try next one

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── API Specific Path ──
    location /api {
        proxy_pass http://backend_apps;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # API might take longer - 30s timeout
    }

    # ── Block Sensitive Files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|bak|log)$ {
        deny all;
        return 403;
    }

    # ── Custom Error Pages ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
