# /etc/nginx/sites-available/mysite.com
# Production HTTPS Config with Let's Encrypt

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name mysite.com www.mysite.com;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        # certbot places challenge files here
        # must be accessible over HTTP
        # even when redirecting to HTTPS
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    # http2 on = enable HTTP/2 protocol
    # HTTP/2 is faster than HTTP/1.1
    # multiplexing = multiple requests per connection
    # header compression = smaller requests

    server_name mysite.com www.mysite.com;

    # Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/mysite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysite.com/privkey.pem;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # session tickets disabled for forward secrecy

    # OCSP Stapling (faster certificate validation)
    ssl_stapling on;
    ssl_stapling_verify on;
    # OCSP = Online Certificate Status Protocol
    # stapling = nginx caches OCSP response
    # browsers get cert status without extra lookup
    # makes HTTPS faster

    # DNS resolver for OCSP
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Website content
    root /var/www/mysite.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript;
    # gzip compresses responses
    # reduces bandwidth usage by 60-80%
    # gzip_min_length = only compress if >1000 bytes
    # gzip_types = which content types to compress

    access_log /var/log/nginx/mysite-access.log;
    error_log /var/log/nginx/mysite-error.log;
}
