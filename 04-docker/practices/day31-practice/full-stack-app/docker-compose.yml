# ================================================
# docker-compose.yml - Full Stack Application
# Author: Asim Raza - Day 31
# Services: nginx, backend, redis, postgres
# ================================================

version: '3.8'

services:

  # ─────────────────────────────────────────────
  # SERVICE 1: PostgreSQL Database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fullstack-postgres

    # environment: set environment variables
    # Two syntaxes work:
    # List: - KEY=value
    # Map:  KEY: value
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: asim
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devops123}
      # ${DB_PASSWORD:-devops123} means:
      # Use DB_PASSWORD env var if set
      # Otherwise use default: devops123
      # Great for: dev default + production override

    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Named volume for data persistence
      # Volume defined in 'volumes' section below

    networks:
      - backend-network
      # Only on backend-network
      # NOT accessible from frontend!

    restart: unless-stopped

    healthcheck:
      # Test if postgres accepts connections
      test: ["CMD-SHELL",
             "pg_isready -U asim -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      # start_period: grace time before checking
      # gives postgres time to initialize

  # ─────────────────────────────────────────────
  # SERVICE 2: Redis Cache
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fullstack-redis

    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis123}
    # > means: multi-line string (folded block)
    # command overrides the image CMD
    # --appendonly yes = persistence enabled
    # --requirepass = password protection

    volumes:
      - redis-data:/data

    networks:
      - backend-network
      # Also only on backend-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli",
             "-a", "${REDIS_PASSWORD:-redis123}",
             "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # SERVICE 3: Backend API
  # ─────────────────────────────────────────────
  backend:
    # build: build from Dockerfile instead of image
    # context: where to find the files
    # dockerfile: which Dockerfile to use
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: fullstack-backend

    image: fullstack-backend:v1.0
    # After building: tag image with this name
    # Future runs use cached image unless --build

    environment:
      APP_ENV: production
      APP_VERSION: "1.0.0"
      PORT: "5000"
      DB_HOST: postgres
      DB_USER: asim
      DB_PASSWORD: ${DB_PASSWORD:-devops123}
      DB_NAME: appdb
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Using container names as hostnames!
      # Docker DNS resolves them automatically

    networks:
      - frontend-network
      - backend-network
      # Backend needs BOTH networks:
      # frontend-network: nginx can reach it
      # backend-network: can reach db and redis

    # depends_on: start order control
    # backend starts AFTER postgres and redis
    # BUT: only waits for container to START
    #      not for service to be READY
    # That's why we have healthchecks
    depends_on:
      postgres:
        condition: service_healthy
        # condition: service_healthy means:
        # wait for postgres healthcheck to PASS
        # not just for container to start
      redis:
        condition: service_healthy

    restart: unless-stopped

    # No ports exposed: only nginx can reach backend
    # Internal service, no direct external access

  # ─────────────────────────────────────────────
  # SERVICE 4: Nginx Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fullstack-nginx

    ports:
      - "8800:80"
      # Only nginx is exposed to internet
      # Everything else is internal only

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Bind mount nginx config read-only
      # :ro = container cannot modify it

    networks:
      - frontend-network
      # Only on frontend-network
      # Can reach backend but NOT database

    depends_on:
      - backend
      # Start after backend is up

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-",
             "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────
# NETWORKS: Define custom networks
# ─────────────────────────────────────────────
networks:
  frontend-network:
    driver: bridge
    # nginx + backend communicate here

  backend-network:
    driver: bridge
    # backend + postgres + redis communicate here
    # NOT accessible from nginx directly!

# ─────────────────────────────────────────────
# VOLUMES: Define named volumes
# ─────────────────────────────────────────────
volumes:
  postgres-data:
    # Empty: use default local driver
    # Data stored in: /var/lib/docker/volumes/

  redis-data:
    # Same: default local driver
