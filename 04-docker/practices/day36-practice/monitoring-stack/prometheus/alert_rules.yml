# ================================================
# alert_rules.yml - Prometheus Alert Rules
# Author: Asim Raza - Day 36
# ================================================

groups:
  - name: container_alerts
    rules:

      # Alert: Container down
      - alert: ContainerDown
        expr: |
          up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.instance }} is down"
          description: >
            Container has been down for more than 1 minute.

      # Alert: High memory usage
      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes /
           container_spec_memory_limit_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory: {{ $labels.name }}"
          description: >
            Container memory usage above 85% for 5 minutes.
            Current: {{ $value | humanizePercentage }}

      # Alert: High CPU usage
      - alert: HighCPUUsage
        expr: |
          rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU: {{ $labels.name }}"
          description: >
            CPU above 80% for 5 minutes.

      # Alert: Container restarting
      - alert: ContainerRestarting
        expr: |
          changes(container_start_time_seconds[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container restart loop: {{ $labels.name }}"
