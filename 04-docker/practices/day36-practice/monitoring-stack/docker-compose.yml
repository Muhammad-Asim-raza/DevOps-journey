# ================================================
# docker-compose.yml - Complete Monitoring Stack
# Author: Asim Raza - Day 36
# Services: App, cAdvisor, Prometheus, Grafana, Loki
# ================================================

version: '3.8'

services:

  # ── Application Being Monitored ──
  metrics-app:
    build: ./app
    container_name: day36-app
    image: metrics-app:v1
    ports:
      - "8401:8000"
    networks:
      - monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; \
              urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── cAdvisor: Container Metrics ──
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: day36-cadvisor
    privileged: true
    # privileged needed to read container stats
    # Acceptable for monitoring tool
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8402:8080"
    networks:
      - monitoring
    restart: unless-stopped
    command:
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
      - '--store_container_labels=false'

  # ── Prometheus: Metrics Database ──
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: day36-prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      # --web.enable-lifecycle = reload config via API
    ports:
      - "8403:9090"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - cadvisor

  # ── Grafana: Visualization ──
  grafana:
    image: grafana/grafana:10.2.0
    container_name: day36-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-DevOps2026!}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:8404
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "8404:3000"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # ── Loki: Log Aggregation ──
  loki:
    image: grafana/loki:2.9.0
    container_name: day36-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "8405:3100"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
