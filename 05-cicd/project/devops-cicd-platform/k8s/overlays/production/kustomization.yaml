apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base
namespace: production
patches:
  - target:
      kind: Deployment
      name: cicd-platform
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
images:
  - name: ghcr.io/muhammad-asim-raza/devops-cicd-platform
    newTag: sha-latest
