# ================================================
# 23-complete-docker-pipeline.yml
# Complete Docker CI/CD Pipeline
# Author: Asim Raza - Day 44
# Combines: test → build → scan → push → verify
# ================================================

name: 23 - Complete Docker Pipeline

on:
  push:
    branches: [main]
    paths:
      - '05-cicd/practices/day44-practice/**'
      - '.github/workflows/23-complete-docker-pipeline.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cicd-docker-demo
  APP_DIR: 05-cicd/practices/day44-practice/docker-app
  MIN_COVERAGE: '80'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────
  # STAGE 1: Test (quality gate)
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Test and Quality Gate
    runs-on: ubuntu-latest

    outputs:
      tests-passed: ${{ steps.result.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Install and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install -r requirements.txt --quiet
          python -m pytest tests/ \
            -v \
            --cov=src \
            --cov-fail-under=${{ env.MIN_COVERAGE }} \
            --junit-xml=results.xml

      - name: Set result
        id: result
        if: success()
        run: echo "passed=true" >> $GITHUB_OUTPUT

      - name: Upload results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: ${{ env.APP_DIR }}/results.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # STAGE 2: Build image
  # ──────────────────────────────────────────────
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image-digest:  ${{ steps.build.outputs.digest }}
      image-tag:     ${{ steps.version.outputs.tag }}
      version:       ${{ steps.version.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          VER="1.0.${{ github.run_number }}"
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT}"
          echo "version=$VER"  >> $GITHUB_OUTPUT
          echo "short-sha=$SHORT" >> $GITHUB_OUTPUT
          echo "tag=$TAG"      >> $GITHUB_OUTPUT
          echo "Version: $VER, Tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.time }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: true
        continue-on-error: true

      - name: Build info
        run: |
          echo "=== BUILD COMPLETE ==="
          echo "Version:  ${{ steps.version.outputs.version }}"
          echo "SHA:      ${{ steps.version.outputs.short-sha }}"
          echo "Digest:   ${{ steps.build.outputs.digest }}"
          echo "Tags:     ${{ steps.meta.outputs.tags }}"

  # ──────────────────────────────────────────────
  # STAGE 3: Security scan
  # ──────────────────────────────────────────────
  scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Scan local Dockerfile
        run: |
          echo "=== Dockerfile Security Scan ==="

          # Check for common security issues
          DOCKERFILE="${{ env.APP_DIR }}/Dockerfile"
          ISSUES=0

          grep -n "^FROM.*:latest" $DOCKERFILE && \
            echo "⚠️  Using :latest tag" && ISSUES=$((ISSUES+1)) || \
            echo "✅ Not using :latest"

          grep -n "^USER root" $DOCKERFILE && \
            echo "⚠️  Running as root" && ISSUES=$((ISSUES+1)) || \
            echo "✅ Not switching to root"

          grep -qn "^USER" $DOCKERFILE && \
            echo "✅ Non-root USER configured" || \
            echo "⚠️  No USER instruction found"

          grep -qn "HEALTHCHECK" $DOCKERFILE && \
            echo "✅ HEALTHCHECK configured" || \
            echo "⚠️  No HEALTHCHECK"

          echo ""
          echo "Issues found: $ISSUES"
          echo "✅ Dockerfile security scan complete"

  # ──────────────────────────────────────────────
  # STAGE 4: Final report
  # ──────────────────────────────────────────────
  report:
    name: 📊 Pipeline Report
    runs-on: ubuntu-latest
    needs: [test, build, scan]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Docker CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test | ${{ needs.test.result }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build | ${{ needs.build.result }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Scan | ${{ needs.scan.result }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build.outputs.version }}" \
            >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ env.REGISTRY }}" \
            >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ needs.build.outputs.image-digest }}\`" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.test.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" ]]; then
            echo "### ✅ Pipeline PASSED" >> $GITHUB_STEP_SUMMARY
            echo "Image ready for deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Pipeline FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Fix issues before deploying" >> $GITHUB_STEP_SUMMARY
          fi
