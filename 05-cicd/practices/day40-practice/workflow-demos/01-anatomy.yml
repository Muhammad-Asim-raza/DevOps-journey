# ================================================
# 01-anatomy.yml
# Complete GitHub Actions Workflow Anatomy
# Author: Asim Raza - Day 40
# Every line explained with comments
# ================================================

# name: Display name in GitHub Actions tab
# Shown in: Actions → workflow list
# Keep it descriptive and short
name: 01 - Complete Workflow Anatomy

# ── TRIGGERS (on:) ──────────────────────────────
# on: defines WHAT events start this workflow
# Multiple events can trigger same workflow
on:

  # TRIGGER 1: push
  # Fires when code is pushed to repository
  push:
    branches:
      - main
      - develop
      # Only trigger on these branches
      # NOT on feature/*, fix/*, etc.
    paths:
      - '05-cicd/**'
      - '.github/workflows/01-anatomy.yml'
      # Only trigger if these paths changed
      # Prevents running on README-only changes
      # VERY useful for monorepos

  # TRIGGER 2: pull_request
  # Fires when PR is opened, updated, or reopened
  pull_request:
    branches:
      - main
    # Test every PR targeting main
    # Most important trigger for quality gates
    types:
      - opened
      - synchronize
      - reopened
      # opened = new PR created
      # synchronize = new commits pushed to PR
      # reopened = closed PR reopened

  # TRIGGER 3: workflow_dispatch
  # Manual trigger - button appears in GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      debug_mode:
        description: 'Enable debug output'
        required: false
        default: 'false'
        type: boolean
      version:
        description: 'Version to deploy'
        required: false
        type: string

  # TRIGGER 4: schedule (cron)
  schedule:
    - cron: '0 6 * * 1'
    # Every Monday at 6am UTC
    # Format: minute hour day month weekday
    # 0 6 * * 1 = 6:00am every Monday

  # TRIGGER 5: workflow_call
  # This workflow can be CALLED by other workflows
  # Makes it reusable across repositories
  # workflow_call: {}

# ── ENVIRONMENT VARIABLES ────────────────────────
# Available to ALL jobs and steps in workflow
env:
  APP_NAME: devops-journey
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  # These are NOT secrets
  # Secrets go in: Settings → Secrets → Actions

# ── PERMISSIONS ──────────────────────────────────
# Control what the GITHUB_TOKEN can do
# Principle of least privilege
permissions:
  contents: read
  # can read repo contents
  packages: write
  # can publish packages/images
  pull-requests: write
  # can comment on PRs
  issues: read

# ── CONCURRENCY ──────────────────────────────────
# Prevent multiple runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  # If new push to branch: cancel old run
  # Saves runner minutes and time

# ── JOBS ─────────────────────────────────────────
jobs:

  # ── JOB 1: Information ──
  # Show workflow context (educational)
  show-context:
    name: 📋 Show Workflow Context
    # name: displayed in GitHub Actions UI

    runs-on: ubuntu-latest
    # runs-on: which runner to use
    # ubuntu-latest = Ubuntu 22.04
    # macos-latest = macOS
    # windows-latest = Windows
    # self-hosted = your own server

    # timeout-minutes: fail if job takes too long
    timeout-minutes: 5

    steps:

      # STEP: Checkout
      # ALWAYS first step in almost every job
      - name: Checkout code
        uses: actions/checkout@v4
        # uses: run a pre-built action
        # actions/checkout = official GitHub action
        # @v4 = pin to version 4
        # Downloads your repo to the runner

      # STEP: Show GitHub context variables
      - name: Show GitHub Context
        run: |
          echo "=== GITHUB CONTEXT ==="
          echo "Event:       ${{ github.event_name }}"
          echo "Ref:         ${{ github.ref }}"
          echo "Branch:      ${{ github.ref_name }}"
          echo "SHA:         ${{ github.sha }}"
          echo "Actor:       ${{ github.actor }}"
          echo "Repository:  ${{ github.repository }}"
          echo "Run ID:      ${{ github.run_id }}"
          echo "Run Number:  ${{ github.run_number }}"
          echo "Workspace:   ${{ github.workspace }}"
          echo "Head commit: ${{ github.event.head_commit.message }}"
        # ${{ github.* }} = GitHub context
        # Contains info about the current run

      # STEP: Show runner context
      - name: Show Runner Context
        run: |
          echo "=== RUNNER CONTEXT ==="
          echo "OS:       ${{ runner.os }}"
          echo "Arch:     ${{ runner.arch }}"
          echo "Name:     ${{ runner.name }}"
          echo "Temp dir: ${{ runner.temp }}"
          echo ""
          echo "=== SYSTEM INFO ==="
          uname -a
          nproc
          free -h
          df -h /

      # STEP: Conditional step
      - name: Only on main branch
        if: github.ref_name == 'main'
        # if: condition = only run if true
        # Many expression options available
        run: echo "This only runs on main branch!"

      - name: Only on PR
        if: github.event_name == 'pull_request'
        run: echo "This only runs on pull requests!"

      - name: Only on manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual trigger!"
          echo "Environment: ${{ inputs.environment }}"
          echo "Debug mode: ${{ inputs.debug_mode }}"

  # ── JOB 2: Environment Setup ──
  setup-environment:
    name: 🔧 Setup Environment
    runs-on: ubuntu-latest
    needs: show-context
    # needs: this job waits for show-context
    # Only runs if show-context succeeds

    # outputs: values available to downstream jobs
    outputs:
      python-path: ${{ steps.setup-python.outputs.python-path }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}

    steps:
      - uses: actions/checkout@v4

      # Setup Python with specific version
      - name: Set up Python
        id: setup-python
        # id: reference this step's outputs later
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Uses workflow-level env var
          cache: 'pip'
          # Cache pip dependencies automatically

      # Show Python info
      - name: Python version info
        run: |
          python --version
          pip --version
          echo "Python path: ${{ steps.setup-python.outputs.python-path }}"
          # steps.STEP_ID.outputs.OUTPUT_NAME

      # Cache pip packages manually
      - name: Cache pip packages
        id: cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        # key: unique identifier for cache
        # hashFiles: hash of requirements files
        # If requirements change: new cache key
        # restore-keys: fallback if exact match not found

  # ── JOB 3: Matrix Strategy ──
  test-matrix:
    name: 🧪 Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: show-context

    strategy:
      fail-fast: false
      # fail-fast: false = don't cancel other matrix
      # jobs if one fails
      # Default: true (cancel all if one fails)
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11']
        include:
          - os: ubuntu-latest
            python: '3.12'
            # Add extra combination
        exclude:
          - os: macos-latest
            python: '3.10'
            # Remove this specific combination

    runs-on: ${{ matrix.os }}
    # Uses matrix value as runner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests
        run: |
          echo "Testing on ${{ matrix.os }}"
          echo "Python version: ${{ matrix.python }}"
          python -c "import sys; print(sys.version)"
          python -c "print('Tests would run here')"

  # ── JOB 4: Artifacts ──
  build-artifact:
    name: 📦 Build and Upload Artifact
    runs-on: ubuntu-latest
    needs: show-context

    steps:
      - uses: actions/checkout@v4

      - name: Create build artifact
        run: |
          mkdir -p dist
          echo "Build: ${{ github.run_number }}" > dist/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> dist/build-info.txt
          echo "Time: $(date -u)" >> dist/build-info.txt
          cat dist/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ github.run_number }}
          path: dist/
          retention-days: 7
          # Keep artifact for 7 days
          # Download from Actions → run → artifacts

  # ── JOB 5: Download and Use Artifact ──
  use-artifact:
    name: 📥 Download and Use Artifact
    runs-on: ubuntu-latest
    needs: build-artifact
    # Must wait for artifact to be uploaded

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: build-${{ github.run_number }}
          path: downloaded/

      - name: Use the artifact
        run: |
          echo "=== Downloaded artifact ==="
          cat downloaded/build-info.txt
