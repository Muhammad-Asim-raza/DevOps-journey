# ================================================

name: 11 - Complete Advanced Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - '05-cicd/**'
      - '.github/workflows/11-complete-advanced-pipeline.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deployment (skip approval wait)'
        type: boolean
        default: false

# Prevent concurrent deployments to same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
  # Cancel in-progress ONLY for non-main branches
  # Main branch: let deployment complete

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: devops-platform
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:

  # ── Stage 1: Validate commit ──
  validate:
    name: ✅ Validate
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.deploy }}
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if should deploy
        id: check
        run: |
          SHOULD_DEPLOY=false

          # Deploy on: main branch push, manual trigger
          if [[ "${{ github.event_name }}" == "push" && \
                "${{ github.ref_name }}" == "main" ]]; then
            SHOULD_DEPLOY=true
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHOULD_DEPLOY=true
          fi

          echo "deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "Should deploy: $SHOULD_DEPLOY"

      - name: Set version
        id: ver
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          VERSION="${{ env.APP_NAME }}-${{ github.run_number }}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate workflow files
        run: |
          echo "=== Validating workflow YAML ==="
          pip install yamllint --quiet
          for f in .github/workflows/*.yml; do
            yamllint -d relaxed "$f" > /dev/null 2>&1 && \
              echo "✅ $f" || echo "⚠️  $f (minor issues)"
          done

  # ── Stage 2: Quality (parallel) ──
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install flake8 --quiet
          flake8 05-cicd/ --max-line-length=100 \
            2>/dev/null || echo "Lint check complete"

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - run: |
          echo "Tests on Python ${{ matrix.python }}"
          python -c "print('All tests passed')"

  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
      - name: Scan for vulnerabilities
        run: |
          echo "Running security scan..."
          echo "✅ No CRITICAL vulnerabilities"
          echo "ℹ️  Report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ── Stage 3: Build ──
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    # All three quality gates must pass

    outputs:
      image-tag: ${{ steps.build.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Build application
        id: build
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ env.REGISTRY }}/${{ env.APP_NAME }}:${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          mkdir -p dist
          echo "App: ${{ env.APP_NAME }}" > dist/manifest.txt
          echo "Version: $VERSION" >> dist/manifest.txt
          echo "Built: $(date -u)" >> dist/manifest.txt
          cat dist/manifest.txt

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_number }}
          path: dist/
          retention-days: 7

  # ── Stage 4: Deploy (only on main) ──
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.should-deploy == 'true'
    environment:
      name: production
      url: https://${{ env.APP_NAME }}.example.com

    steps:
      - uses: actions/download-artifact@v3
        with:
          name: ${{ env.APP_NAME }}-${{ github.run_number }}
          path: ./artifact

      - name: Deploy
        run: |
          echo "=== PRODUCTION DEPLOYMENT ==="
          cat ./artifact/manifest.txt
          echo ""
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          echo "✅ Deployment complete"

  # ── Stage 5: Final Report (always runs) ──
  report:
    name: 📊 Pipeline Report
    runs-on: ubuntu-latest
    needs: [validate, lint, test, security, build, deploy]
    if: always()

    steps:
      - name: Generate report
        run: |
          echo "## 🚀 Pipeline: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "=== PIPELINE FAILED ==="
          echo "Check the summary above for details"
          echo "Would notify Slack here in production"
