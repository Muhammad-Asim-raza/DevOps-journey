# ================================================
# Rolling Update Strategy - Kubernetes Deployment
# Author: Asim Raza - Day 50
# Default and most common strategy
# ================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    app: demo
    strategy: rolling-update
    version: "2.0.0"
  annotations:
    kubernetes.io/change-cause: "v2.0.0 - rolling update"
    # change-cause: shown in rollout history
spec:
  replicas: 6

  strategy:
    type: RollingUpdate
    # type: RollingUpdate = default Kubernetes strategy
    rollingUpdate:
      maxSurge: 2
      # maxSurge: max EXTRA pods during update
      # 6 replicas + maxSurge 2 = 8 max pods
      # Higher = faster update, more resource cost
      # Can be: number (2) or percentage (33%)
      maxUnavailable: 0
      # maxUnavailable: max pods DOWN during update
      # 0 = zero downtime (always 6 pods available)
      # Higher = faster update, some downtime
      # Can be: number (0) or percentage (0%)

  selector:
    matchLabels:
      app: demo

  # Minimum readiness before considered available
  minReadySeconds: 10
  # minReadySeconds: pod must be ready for this many
  # seconds before considered stable
  # Prevents: briefly-healthy pods that crash later
  # being counted as successful

  # Time to abort if update doesn't progress
  progressDeadlineSeconds: 300
  # progressDeadlineSeconds: if update stuck for
  # 5 minutes: mark deployment as failed

  template:
    metadata:
      labels:
        app: demo
        version: "2.0.0"
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            # failureThreshold: 3 failures = not ready
            # Pod won't receive traffic until ready
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      # Graceful shutdown (Day 35 pattern!)
      terminationGracePeriodSeconds: 30
      # terminationGracePeriodSeconds: 30 seconds for
      # the pod to finish in-flight requests before kill
