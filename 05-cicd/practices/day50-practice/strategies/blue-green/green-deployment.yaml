apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  labels:
    app: demo
    color: green
    version: "2.0.0"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: demo
      color: green
  template:
    metadata:
      labels:
        app: demo
        color: green
        version: "2.0.0"
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          # v2.0.0 = nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
