# 12-secrets-management.yml
# Secrets and Variables Management
# Author: Asim Raza - Day 42
# ================================================

name: 12 - Secrets Management

on:
  push:
    branches: [main]
    paths:
      - '05-cicd/**'
      - '.github/workflows/12-secrets-management.yml'
  workflow_dispatch:

# ── WORKFLOW-LEVEL VARIABLES (not secrets) ──
# Visible in logs - use for non-sensitive config
env:
  APP_NAME: devops-journey
  PYTHON_VERSION: '3.11'
  REGION: us-east-1
  # These are VARIABLES not secrets
  # Use: vars.VARIABLE_NAME for repository variables
  # Use: env.VARIABLE_NAME for workflow env vars

jobs:

  # ── Job 1: How secrets work ──
  secrets-demo:
    name: 🔐 Secrets Demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Correct: Use secrets via context ──
      - name: Using secrets correctly
        env:
          # Map secrets to step env vars
          # Best practice: env at step level
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # secrets.NAME = GitHub Secret
          # Encrypted, masked in logs
          # Shows as *** if accidentally echoed
        run: |
          echo "=== Secrets Demo ==="

          # These will show *** (masked) in logs
          echo "DB_PASSWORD: $DB_PASSWORD"
          echo "API_KEY: $API_KEY"

          # Check if secret is set
          if [ -z "$DB_PASSWORD" ]; then
            echo "⚠️  DB_PASSWORD not set (expected in real usage)"
          else
            echo "✅ DB_PASSWORD is set (shown as *** in logs)"
          fi

          # Use secret in command (masked automatically)
          echo "Using in command: ${DB_PASSWORD:+[SECRET_SET]}"

      # ── GitHub Variables (not secrets) ──
      - name: GitHub Variables (vars context)
        run: |
          echo "=== GitHub Variables ==="
          echo "App name: ${{ vars.APP_NAME || 'not set - using env' }}"
          echo "Region: ${{ vars.AWS_REGION || env.REGION }}"
          # vars.NAME = GitHub Variable (not secret)
          # Set in: Settings → Secrets → Variables tab
          # Visible in logs (OK for non-sensitive)

      # ── Built-in secrets ──
      - name: Built-in GITHUB_TOKEN
        env:
          # GITHUB_TOKEN is auto-generated per run
          # Scoped to current repo + workflow
          # Used for: commenting on PRs, creating releases
          # Does NOT need to be stored
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GITHUB_TOKEN ==="
          echo "GITHUB_TOKEN is auto-provided!"
          echo "No need to store it"
          echo "Scoped to this workflow run"
          echo "Expires when workflow completes"

      # ── Safe secret usage patterns ──
      - name: Safe patterns for secrets
        run: |
          echo "=== Safe Secret Patterns ==="
          echo ""
          echo "❌ NEVER do this:"
          echo "   run: mycommand --password secret123"
          echo "   (in .yml file = in Git = exposed)"
          echo ""
          echo "❌ NEVER do this:"
          echo "   run: echo 'DB_PASS=secret' > .env"
          echo "   (if artifact uploaded = exposed)"
          echo ""
          echo "✅ DO this:"
          echo "   env:"
          echo "     DB_PASS: \${{ secrets.DB_PASSWORD }}"
          echo "   run: mycommand  # reads from env"
          echo ""
          echo "✅ DO this for files:"
          echo "   run: |"
          echo "     echo \"\${{ secrets.KUBECONFIG }}\" > kubeconfig"
          echo "     export KUBECONFIG=kubeconfig"
          echo "     kubectl apply -f deployment.yml"
          echo "     rm kubeconfig  # cleanup!"

      # ── Secret rotation pattern ──
      - name: Secret rotation strategy
        run: |
          echo "=== Secret Rotation ==="
          echo ""
          echo "Best practice: rotate secrets regularly"
          echo ""
          echo "Rotation process:"
          echo "1. Generate new credential in service"
          echo "2. Add new secret: MY_KEY_NEW"
          echo "3. Update workflow to use MY_KEY_NEW"
          echo "4. Verify workflow works"
          echo "5. Delete MY_KEY (old)"
          echo "6. Rename MY_KEY_NEW → MY_KEY"
          echo ""
          echo "Zero-downtime rotation!"

  # ── Job 2: Environment-specific secrets ──
  environment-secrets:
    name: 🌍 Environment Secrets
    runs-on: ubuntu-latest
    # Demonstrates different secrets per environment

    strategy:
      matrix:
        environment: [staging, production]

    environment: ${{ matrix.environment }}
    # Each job uses its own environment's secrets
    # staging job: secrets.DB_URL = staging DB
    # production job: secrets.DB_URL = prod DB
    # SAME secret name, DIFFERENT values!

    steps:
      - uses: actions/checkout@v4

      - name: Show environment context
        env:
          DB_URL: ${{ secrets.DB_URL }}
          # This secret has different values in:
          # staging environment
          # production environment
        run: |
          echo "=== Environment: ${{ matrix.environment }} ==="
          echo "DB_URL: ${DB_URL:+[SET]}"
          echo "Using ${{ matrix.environment }} database"
          echo ""
          if [ "${{ matrix.environment }}" == "production" ]; then
            echo "⚠️  Production: extra caution required"
          else
            echo "ℹ️  Staging: safe to test freely"
          fi

  # ── Job 3: Secret masking deep dive ──
  masking-demo:
    name: 🎭 Secret Masking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Demonstrate add-mask command
        run: |
          # ::add-mask:: marks a value as secret
          # Even if not from secrets context
          DYNAMIC_VALUE="sensitive-runtime-value-$(date +%s)"
          echo "::add-mask::$DYNAMIC_VALUE"
          # ↑ This marks DYNAMIC_VALUE as sensitive
          # Now it shows as *** in all subsequent logs

          echo "Dynamic value: $DYNAMIC_VALUE"
          # Shows: Dynamic value: ***

          echo "In another echo: $DYNAMIC_VALUE"
          # Shows: In another echo: ***

      - name: Demonstrate secret detection
        run: |
          echo "=== What GitHub automatically masks ==="
          echo "Any value from secrets.* context"
          echo "Any value added with ::add-mask::"
          echo ""
          echo "GitHub scans ALL log output"
          echo "Replaces secret values with ***"
          echo "Cannot be turned off"
          echo ""
          echo "Note: partial matches also masked"
          echo "If secret is 'password123':"
          echo "  'my password123 here' → 'my *** here'"
