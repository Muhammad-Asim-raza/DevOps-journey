# ================================================
# 15-secrets-scanning.yml
# Secrets Scanning and Security Checks
# Author: Asim Raza - Day 42
# ================================================

name: 15 - Secrets Scanning

on:
  push:
    branches: [main]
    paths:
      - '05-cicd/**'
      - '.github/workflows/15-secrets-scanning.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # ── Scan for accidentally committed secrets ──
  secret-scan:
    name: 🔍 Secret Scanner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Full history needed for comprehensive scan

      - name: Scan with gitleaks
        run: |
          # Install gitleaks - open source secret scanner
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz \
            2>/dev/null || echo "Download attempted"

          if [ -f "gitleaks_8.18.0_linux_x64.tar.gz" ]; then
            tar -xzf gitleaks_8.18.0_linux_x64.tar.gz gitleaks
            echo "=== Running Gitleaks ==="
            ./gitleaks detect \
              --source . \
              --no-git \
              --verbose 2>&1 | head -30 || \
              echo "Gitleaks scan complete"
          else
            echo "Gitleaks download failed, using manual scan"
          fi

      - name: Manual secret pattern scan
        run: |
          echo "=== Manual Secret Pattern Scanner ==="
          FOUND=0

          # Define patterns to detect
          declare -A PATTERNS=(
            ["AWS Access Key"]="AKIA[0-9A-Z]{16}"
            ["AWS Secret Key"]="[0-9a-zA-Z/+]{40}"
            ["GitHub Token"]="gh[pousr]_[A-Za-z0-9]{36}"
            ["Generic Password"]="[Pp]assword\s*[=:]\s*['\"][^'\"]{8,}['\"]"
            ["Private Key"]="-----BEGIN.*PRIVATE KEY-----"
            ["Stripe Key"]="sk_live_[0-9a-zA-Z]{24}"
            ["Generic API Key"]="api[_-]?key['\"\s]*[:=]['\"\s]*[0-9a-zA-Z]{16,}"
          )

          # Scan all files
          for PATTERN_NAME in "${!PATTERNS[@]}"; do
            PATTERN="${PATTERNS[$PATTERN_NAME]}"
            MATCHES=$(grep -rE "$PATTERN" \
              --include="*.py" \
              --include="*.js" \
              --include="*.yml" \
              --include="*.yaml" \
              --include="*.env" \
              --include="*.conf" \
              . \
              --exclude-dir=".git" \
              --exclude-dir="node_modules" \
              2>/dev/null | \
              grep -v "CHANGE_ME\|example\|sample\|test\|demo\|placeholder\|your-\|dummy" | \
              grep -v "^Binary" | \
              head -3)

            if [ -n "$MATCHES" ]; then
              echo "⚠️  Possible $PATTERN_NAME detected:"
              echo "$MATCHES" | head -3
              FOUND=$((FOUND + 1))
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "✅ No secret patterns detected"
          else
            echo ""
            echo "⚠️  $FOUND potential secret(s) found"
            echo "Review the above carefully"
            echo "If false positives: add to allowlist"
          fi

      - name: Check for .env files accidentally staged
        run: |
          echo ""
          echo "=== Checking for sensitive files ==="
          SENSITIVE_FILES=(
            ".env"
            ".env.local"
            ".env.production"
            "credentials.json"
            "*.pem"
            "*.key"
            "*.pfx"
            "id_rsa"
            "id_ed25519"
          )

          ALL_CLEAN=true
          for PATTERN in "${SENSITIVE_FILES[@]}"; do
            FOUND=$(find . -name "$PATTERN" \
              -not -path "./.git/*" \
              -not -name "*.example" \
              2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "⚠️  Found: $FOUND"
              echo "   Ensure this is in .gitignore!"
              ALL_CLEAN=false
            fi
          done

          if $ALL_CLEAN; then
            echo "✅ No sensitive files found in tree"
          fi

      - name: Verify .gitignore covers secrets
        run: |
          echo ""
          echo "=== .gitignore Security Coverage ==="
          REQUIRED_PATTERNS=(
            ".env"
            "*.pem"
            "*.key"
            "*.tfstate"
            "node_modules"
            "__pycache__"
          )

          if [ -f ".gitignore" ]; then
            for PATTERN in "${REQUIRED_PATTERNS[@]}"; do
              if grep -q "$PATTERN" .gitignore; then
                echo "✅ $PATTERN is ignored"
              else
                echo "❌ $PATTERN NOT in .gitignore!"
              fi
            done
          else
            echo "❌ No .gitignore file found!"
          fi

  # ── Generate security report ──
  security-report:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    needs: secret-scan
    if: always()

    steps:
      - name: Create security summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## 🔐 Secrets Security Report

          ### Scans Performed
          | Check | Status |
          |-------|--------|
          | Secret pattern scan | ✅ |
          | Sensitive file check | ✅ |
          | .gitignore coverage | ✅ |

          ### Best Practices Verified
          - [ ] No credentials hardcoded in code
          - [ ] No .env files in repository
          - [ ] .gitignore covers sensitive extensions
          - [ ] OIDC used where possible (no static keys)
          - [ ] Environment secrets for per-env creds

          ### Next Steps
          1. Configure GitHub secret scanning alerts
          2. Enable push protection (blocks secret commits)
          3. Set up periodic rotation reminders
          4. Use OIDC for AWS/GCP/Azure (Phase 6)
          SUMMARY
