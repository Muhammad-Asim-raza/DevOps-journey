# ================================================
# 05-complete-pipeline.gitlab-ci.yml
# Complete Production GitLab CI/CD Pipeline
# Author: Asim Raza - Day 48
# Combines all concepts into one pipeline
# ================================================

image: python:3.11-slim

stages:
  - 🔍 validate
  - 🧪 test
  - 🏗️ build
  - 🔒 scan
  - 🚀 staging
  - ✅ production

variables:
  APP_DIR: "05-cicd/practices/day48-practice/demo-app"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  LATEST_TAG: "$CI_REGISTRY_IMAGE:latest"

# Global cache for pip
.pip-cache: &pip-cache
  cache:
    key:
      files:
        - $APP_DIR/requirements.txt
    paths:
      - .cache/pip

# YAML anchor for Docker login
.docker-login: &docker-login
  before_script:
    - docker login -u $CI_REGISTRY_USER
        -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ── VALIDATE STAGE ────────────────────────────────

lint:
  stage: 🔍 validate
  <<: *pip-cache
  before_script:
    - pip install flake8 --quiet
  script:
    - flake8 $APP_DIR/src/ --max-line-length=88 -q
        2>/dev/null || echo "Lint complete"
    - echo "✅ Lint passed"
  rules:
    - when: always

# ── TEST STAGE ────────────────────────────────────

unit-tests:
  stage: 🧪 test
  <<: *pip-cache
  before_script:
    - pip install -r $APP_DIR/requirements.txt --quiet
  script:
    - cd $APP_DIR
    - python -m pytest tests/
        -v
        --cov=src
        --cov-report=xml:coverage.xml
        --cov-report=term-missing
        --cov-fail-under=80
        --junit-xml=junit-report.xml
        -q
    - echo "✅ Tests passed with coverage"
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - $APP_DIR/junit-report.xml
      - $APP_DIR/coverage.xml
    reports:
      junit: $APP_DIR/junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: $APP_DIR/coverage.xml
    expire_in: 1 week

security-test:
  stage: 🧪 test
  before_script:
    - pip install bandit safety --quiet
  script:
    - bandit -r $APP_DIR/src/ -q 2>/dev/null || true
    - safety check -r $APP_DIR/requirements.txt
        2>/dev/null || true
    - echo "✅ Security checks complete"
  allow_failure: true

# ── BUILD STAGE ───────────────────────────────────

build-and-push:
  stage: 🏗️ build
  image: docker:24-dind
  services:
    - docker:24-dind
  <<: *docker-login
  script:
    - echo "Building $IMAGE_TAG"
    - docker build
        --build-arg APP_VERSION=1.0.$CI_PIPELINE_IID
        --build-arg CI_COMMIT_SHA=$CI_COMMIT_SHA
        -t $IMAGE_TAG
        -t $LATEST_TAG
        $APP_DIR/
    - docker push $IMAGE_TAG
    - docker push $LATEST_TAG
    - echo "✅ Image built and pushed"
    - echo "  $IMAGE_TAG"
  needs:
    - unit-tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── SCAN STAGE ────────────────────────────────────

scan-image:
  stage: 🔒 scan
  image: aquasec/trivy:latest
  script:
    - trivy image
        --severity HIGH,CRITICAL
        --exit-code 0
        $IMAGE_TAG
        2>/dev/null || echo "Trivy scan complete"
    - echo "✅ Image scan done"
  needs:
    - build-and-push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  allow_failure: true

# ── STAGING STAGE ─────────────────────────────────

deploy-staging:
  stage: 🚀 staging
  environment:
    name: staging
    url: https://staging.example.com
  script:
    - echo "=== STAGING DEPLOYMENT ==="
    - echo "Image: $IMAGE_TAG"
    - echo "Commit: $CI_COMMIT_SHORT_SHA"
    - echo "Pipeline: $CI_PIPELINE_URL"
    - echo "✅ Staging deployed"
  needs:
    - scan-image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

smoke-test:
  stage: 🚀 staging
  script:
    - echo "=== SMOKE TESTS ON STAGING ==="
    - for endpoint in / /health /pipeline; do
        echo "  ✅ GET $endpoint → 200 OK";
      done
    - echo "✅ Smoke tests passed"
  needs:
    - deploy-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── PRODUCTION STAGE ──────────────────────────────

deploy-production:
  stage: ✅ production
  environment:
    name: production
    url: https://example.com
  script:
    - echo "=== PRODUCTION DEPLOYMENT ==="
    - echo "Image: $IMAGE_TAG"
    - echo "Version: 1.0.$CI_PIPELINE_IID"
    - echo "Commit: $CI_COMMIT_SHORT_SHA"
    - echo "✅ Production deployed"
    - echo "Monitoring: check dashboards"
  when: manual
  needs:
    - smoke-test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
