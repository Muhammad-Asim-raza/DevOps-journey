# ================================================
# 02-variables.gitlab-ci.yml
# GitLab CI Variables Complete Reference
# Author: Asim Raza - Day 48
# ================================================

image: python:3.11-slim

stages:
  - demonstrate

variables:
  # Pipeline-level custom variables
  APP_NAME: "gitlab-demo"
  DEPLOY_TIMEOUT: "60"

show-predefined-variables:
  stage: demonstrate
  script:
    - echo "================================================"
    - echo "  GITLAB PREDEFINED CI/CD VARIABLES"
    - echo "================================================"
    - echo ""
    - echo "[ PROJECT VARIABLES ]"
    - echo "CI_PROJECT_ID:           $CI_PROJECT_ID"
    - echo "CI_PROJECT_NAME:         $CI_PROJECT_NAME"
    - echo "CI_PROJECT_PATH:         $CI_PROJECT_PATH"
    - echo "CI_PROJECT_URL:          $CI_PROJECT_URL"
    - echo "CI_PROJECT_NAMESPACE:    $CI_PROJECT_NAMESPACE"
    - echo ""
    - echo "[ PIPELINE VARIABLES ]"
    - echo "CI_PIPELINE_ID:          $CI_PIPELINE_ID"
    - echo "CI_PIPELINE_IID:         $CI_PIPELINE_IID"
    - echo "CI_PIPELINE_URL:         $CI_PIPELINE_URL"
    - echo "CI_PIPELINE_SOURCE:      $CI_PIPELINE_SOURCE"
    - echo ""
    - echo "[ JOB VARIABLES ]"
    - echo "CI_JOB_ID:               $CI_JOB_ID"
    - echo "CI_JOB_NAME:             $CI_JOB_NAME"
    - echo "CI_JOB_STAGE:            $CI_JOB_STAGE"
    - echo "CI_JOB_URL:              $CI_JOB_URL"
    - echo "CI_JOB_TOKEN:            [MASKED]"
    - echo ""
    - echo "[ GIT/COMMIT VARIABLES ]"
    - echo "CI_COMMIT_SHA:           $CI_COMMIT_SHA"
    - echo "CI_COMMIT_SHORT_SHA:     $CI_COMMIT_SHORT_SHA"
    - echo "CI_COMMIT_BRANCH:        $CI_COMMIT_BRANCH"
    - echo "CI_COMMIT_REF_NAME:      $CI_COMMIT_REF_NAME"
    - echo "CI_COMMIT_REF_SLUG:      $CI_COMMIT_REF_SLUG"
    - echo "CI_COMMIT_TITLE:         $CI_COMMIT_TITLE"
    - echo "CI_COMMIT_AUTHOR:        $CI_COMMIT_AUTHOR"
    - echo "CI_COMMIT_TIMESTAMP:     $CI_COMMIT_TIMESTAMP"
    - echo ""
    - echo "[ REGISTRY VARIABLES ]"
    - echo "CI_REGISTRY:             $CI_REGISTRY"
    - echo "CI_REGISTRY_IMAGE:       $CI_REGISTRY_IMAGE"
    - echo "CI_REGISTRY_USER:        $CI_REGISTRY_USER"
    - echo "CI_REGISTRY_PASSWORD:    [MASKED - auto job token]"
    - echo ""
    - echo "[ MERGE REQUEST VARIABLES ]"
    - echo "CI_MERGE_REQUEST_ID:     $CI_MERGE_REQUEST_ID"
    - echo "CI_MERGE_REQUEST_IID:    $CI_MERGE_REQUEST_IID"
    - echo "CI_MERGE_REQUEST_TITLE:  $CI_MERGE_REQUEST_TITLE"
    - echo ""
    - echo "[ ENVIRONMENT VARIABLES ]"
    - echo "CI_ENVIRONMENT_NAME:     $CI_ENVIRONMENT_NAME"
    - echo "CI_ENVIRONMENT_URL:      $CI_ENVIRONMENT_URL"
    - echo ""
    - echo "[ RUNNER VARIABLES ]"
    - echo "CI_RUNNER_ID:            $CI_RUNNER_ID"
    - echo "CI_RUNNER_DESCRIPTION:   $CI_RUNNER_DESCRIPTION"

show-custom-variables:
  stage: demonstrate
  variables:
    # Job-level variables override pipeline-level
    JOB_SPECIFIC: "only-this-job"
    APP_NAME: "overridden-in-job"
    # APP_NAME was 'gitlab-demo', now 'overridden-in-job'
  script:
    - echo "[ CUSTOM VARIABLES ]"
    - echo "Pipeline-level: APP_NAME=$APP_NAME"
    - echo "Job-level: JOB_SPECIFIC=$JOB_SPECIFIC"
    - echo "DEPLOY_TIMEOUT=$DEPLOY_TIMEOUT"
    - echo ""
    - echo "[ SECURE VARIABLE USAGE ]"
    - echo "DB_PASSWORD is: ${DB_PASSWORD:+[SET]}"
    - echo "API_KEY is: ${API_KEY:+[SET]}"
    - echo "(Use :+[SET] to check if set without exposing value)"
    - echo ""
    - echo "Variable sources (priority order):"
    - echo "1. Trigger variables (highest)"
    - echo "2. Scheduled pipeline variables"
    - echo "3. Manual pipeline variables"
    - echo "4. Project CI/CD variables (Settings)"
    - echo "5. Group CI/CD variables"
    - echo "6. Instance CI/CD variables"
    - echo "7. .gitlab-ci.yml variables (lowest)"

variable-masking-demo:
  stage: demonstrate
  variables:
    # NEVER put actual secrets here
    # This is for demonstration only
    SAFE_VALUE: "not-a-secret"
  script:
    - echo "=== VARIABLE PROTECTION ==="
    - echo ""
    - echo "GitLab variable types:"
    - echo ""
    - echo "Regular: visible in logs"
    - echo "  MY_VAR: hello"
    - echo "  → 'hello' appears in logs"
    - echo ""
    - echo "Masked: hidden in logs"
    - echo "  MY_SECRET: sensitive-value"
    - echo "  masked: true"
    - echo "  → '***' appears in logs"
    - echo ""
    - echo "Protected: only on protected branches"
    - echo "  PROD_SECRET: prod-value"
    - echo "  protected: true"
    - echo "  → Only available on main, production tags"
    - echo ""
    - echo "File type: written to temp file"
    - echo "  MY_KUBECONFIG: (kubeconfig content)"
    - echo "  file: true"
    - echo "  → \$MY_KUBECONFIG = /path/to/temp/file"
    - echo "  → Perfect for: kubeconfig, certificates"
