# docker-compose.yml - Jenkins Setup
# Author: Asim Raza - Day 46
# ================================================

version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    # jenkins/jenkins = official Jenkins image
    # lts = Long Term Support (stable)
    # jdk17 = includes Java 17 (required for Jenkins 2.x)
    # lts-jdk17 = stable + Java 17

    container_name: jenkins-day46

    # Run Jenkins as root in container
    # Needed to install plugins and use Docker
    user: root
    # user: root = run as root inside container
    # In production: use proper user namespace mapping

    ports:
      - "8090:8080"
      # 8090 = host port (access Jenkins UI)
      # 8080 = Jenkins default port in container
      # Access at: http://localhost:8090

      - "50000:50000"
      # 50000 = Jenkins JNLP agent port
      # Agents connect on this port
      # Only needed if using inbound agents

    volumes:
      - jenkins-data:/var/jenkins_home
      # jenkins-data = named volume (persistent!)
      # /var/jenkins_home = Jenkins stores everything here:
      #   jobs, plugins, credentials, build history
      # If container removed: data stays in volume

      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker socket into Jenkins container
      # Allows Jenkins to build Docker images
      # Jenkins can run: docker build, docker push
      # WARNING: gives Jenkins container access to
      # Docker daemon (powerful but risky)
      # Acceptable for learning, review for production

    environment:
      - JENKINS_OPTS=--httpPort=8080
      # Jenkins HTTP port inside container

      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
      # runSetupWizard=true = show initial setup wizard
      # Set to false to skip wizard (for automation)

    restart: unless-stopped
    # Restart Jenkins if it crashes or server reboots

    networks:
      - jenkins-network

networks:
  jenkins-network:
    driver: bridge

volumes:
  jenkins-data:
    # Named volume persists even if container removed
    # Back up with: docker run --rm -v jenkins-data:/data
    #   -v $(pwd):/backup ubuntu tar czf /backup/jenkins.tar.gz /data
