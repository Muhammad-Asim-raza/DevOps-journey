# ================================================
# 24-deploy-staging.yml
# Automated Staging Deployment
# Author: Asim Raza - Day 45
# ================================================

name: 24 - Deploy to Staging

on:
  push:
    branches: [main]
    paths:
      - '05-cicd/practices/day44-practice/**'
      - '05-cicd/practices/day45-practice/**'
      - '.github/workflows/24-deploy-staging.yml'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Specific image tag to deploy'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cicd-docker-demo
  APP_DIR: 05-cicd/practices/day44-practice/docker-app

concurrency:
  group: deploy-staging
  cancel-in-progress: false
  # Never cancel in-progress staging deployments!
  # Could leave staging in broken state

jobs:

  # ──────────────────────────────────────────────
  # Stage 1: Build image (if not provided)
  # ──────────────────────────────────────────────
  build:
    name: 🏗️ Build Image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      version:   ${{ steps.tag.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image-tag }}" ]; then
            # Use provided tag
            TAG="${{ inputs.image-tag }}"
            VER="${TAG##*:}"
          else
            # Generate from commit
            SHORT="${{ github.sha }}"
            SHORT="${SHORT:0:7}"
            VER="1.0.${{ github.run_number }}"
            TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Stage 2: Deploy to staging
  # ──────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: staging
      url: https://staging.devops-journey.example.com

    outputs:
      deploy-status: ${{ steps.deploy.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        id: deploy
        run: |
          echo "=== STAGING DEPLOYMENT ==="
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Time: $(date -u)"
          echo ""

          # In production this would be:
          # uses: appleboy/ssh-action@master
          # with:
          #   host: ${{ secrets.STAGING_HOST }}
          #   username: ${{ secrets.STAGING_USER }}
          #   key: ${{ secrets.STAGING_SSH_KEY }}
          #   script: |
          #     /opt/scripts/deploy.sh \
          #       devops-platform \
          #       ${{ needs.build.outputs.image-tag }}

          # Simulated for learning
          echo "SSH → staging.example.com"
          echo "  docker pull ${{ needs.build.outputs.image-tag }}"
          echo "  docker-compose up -d --no-deps app"
          echo "  Waiting for health check..."
          sleep 2
          echo "  HTTP 200 ✅"

          echo "status=success" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ Staging deployment complete"

      - name: Run smoke tests
        run: |
          echo "=== SMOKE TESTS (staging) ==="

          # In production:
          # bash smoke-test.sh https://staging.example.com

          for endpoint in / /health /ready /version; do
            echo "  ✅ GET $endpoint → 200 OK"
            sleep 0.2
          done

          echo ""
          echo "✅ All smoke tests passed"

      - name: Notify Slack - staging
        if: always()
        run: |
          STATUS="${{ steps.deploy.outputs.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"

          echo "=== SLACK NOTIFICATION ==="
          echo "${ICON} Staging Deployment"
          echo "  App: devops-platform"
          echo "  Version: ${{ needs.build.outputs.version }}"
          echo "  Status: ${STATUS}"
          echo "  URL: https://staging.devops-journey.example.com"
          echo "  By: ${{ github.actor }}"

          # In production:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-type: application/json' \
          #   --data '{
          #     "text": "'"${ICON}"' Staging deployed v${{ needs.build.outputs.version }}"
          #   }'

  # ──────────────────────────────────────────────
  # Stage 3: Integration tests on staging
  # ──────────────────────────────────────────────
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.outputs.deploy-status == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run integration tests
        run: |
          echo "=== INTEGRATION TESTS ON STAGING ==="
          echo ""

          # In production: run against actual staging URL
          # pytest tests/integration/ \
          #   --base-url=https://staging.example.com \
          #   --junit-xml=integration-results.xml

          echo "Test 1: API → Database roundtrip"
          sleep 0.3
          echo "  ✅ PASSED"

          echo "Test 2: Authentication flow"
          sleep 0.3
          echo "  ✅ PASSED"

          echo "Test 3: Rate limiting works"
          sleep 0.3
          echo "  ✅ PASSED"

          echo "Test 4: Cache (Redis) working"
          sleep 0.3
          echo "  ✅ PASSED"

          echo ""
          echo "✅ 4/4 integration tests passed"

      - name: Update deployment status
        run: |
          echo "## ✅ Staging Ready for Production" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.build.outputs.version }}" \
            >> $GITHUB_STEP_SUMMARY
          echo "- All smoke tests: passed" \
            >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: 4/4 passed" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ready to approve production deployment**" \
            >> $GITHUB_STEP_SUMMARY
