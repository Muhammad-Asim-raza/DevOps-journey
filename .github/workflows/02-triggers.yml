# ================================================
# 02-triggers.yml
# All Trigger Types Demonstrated
# Author: Asim Raza - Day 40
# ================================================

name: 02 - Triggers Deep Dive

on:

  # Push to specific branches/paths
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/v[0-9]+.[0-9]+'
      # Glob patterns work here!
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      # Ignore documentation-only changes

  # PR events
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

  # When a release is published
  release:
    types: [published]
    # Trigger on GitHub Releases
    # Perfect for production deployments

  # Scheduled cron
  schedule:
    - cron: '0 2 * * *'
    # 2am UTC every day (nightly build)

  # Manual with inputs
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment'
        type: environment
        required: true

  # Another workflow calls this one
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      deploy_key:
        required: true

  # Repository dispatch (API trigger)
  repository_dispatch:
    types: [deploy-event, test-event]
    # Trigger via GitHub API:
    # POST /repos/owner/repo/dispatches
    # {"event_type": "deploy-event"}

jobs:

  detect-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect and handle trigger type
        run: |
          echo "Triggered by: ${{ github.event_name }}"

          case "${{ github.event_name }}" in
            push)
              echo "Push to: ${{ github.ref_name }}"
              echo "Commit: ${{ github.sha }}"
              echo "By: ${{ github.actor }}"
              ;;
            pull_request)
              echo "PR #${{ github.event.pull_request.number }}"
              echo "Title: ${{ github.event.pull_request.title }}"
              echo "From: ${{ github.head_ref }}"
              echo "To: ${{ github.base_ref }}"
              ;;
            schedule)
              echo "Scheduled run at: $(date -u)"
              echo "Running nightly maintenance..."
              ;;
            workflow_dispatch)
              echo "Manual trigger by: ${{ github.actor }}"
              echo "Environment: ${{ inputs.deploy_env }}"
              ;;
            release)
              echo "Release: ${{ github.event.release.tag_name }}"
              echo "Name: ${{ github.event.release.name }}"
              ;;
          esac

      - name: PR-specific step
        if: github.event_name == 'pull_request'
        run: |
          echo "Running PR-specific checks..."
          echo "This ONLY runs on pull requests"

      - name: Push to main only
        if: |
          github.event_name == 'push' &&
          github.ref_name == 'main'
        run: |
          echo "Main branch push!"
          echo "This would trigger deployment"

      - name: Release deployment
        if: github.event_name == 'release'
        run: |
          echo "Production deployment triggered"
          echo "Version: ${{ github.event.release.tag_name }}"
