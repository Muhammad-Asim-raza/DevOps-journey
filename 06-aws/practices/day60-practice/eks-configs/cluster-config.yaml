# ================================================
# cluster-config.yaml
# Production EKS Cluster Configuration
# Author: Asim Raza - Day 60
# ================================================

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-journey
  region: us-east-1
  version: "1.30"
  # Always pin to specific K8s version
  # Check: eksctl utils describe-addon-versions
  tags:
    Project: devops-journey
    Day: "60"
    Owner: asim-raza

# ── VPC CONFIGURATION ────────────────────────────
# Option A: eksctl creates new VPC (below)
# Option B: Use existing VPC (uncomment and fill)
# vpc:
#   id: vpc-xxxxx
#   subnets:
#     private:
#       us-east-1a: { id: subnet-private-a }
#       us-east-1b: { id: subnet-private-b }
#     public:
#       us-east-1a: { id: subnet-public-a }
#       us-east-1b: { id: subnet-public-b }

vpc:
  cidr: 10.100.0.0/16
  # Use different CIDR from your Day 55 VPC
  # to avoid overlap if you peer them later

  clusterEndpoints:
    publicAccess: true
    # publicAccess: allows kubectl from laptop
    # For maximum security: false + VPN/bastion only
    privateAccess: true
    # privateAccess: nodes can reach API server
    # privately within VPC

  nat:
    gateway: HighlyAvailable
    # HighlyAvailable: one NAT GW per AZ
    # Single: cheaper but AZ dependency
    # Disable: no NAT (not recommended)

# ── IAM CONFIGURATION ────────────────────────────
iam:
  withOIDC: true
  # withOIDC: enables OIDC provider for cluster
  # REQUIRED for IRSA (IAM Roles for Service Accounts)
  # This is how pods get AWS permissions (like EC2 instance profile)
  # Most important IAM setting for EKS!

  serviceAccounts:
    # Pre-create service accounts with IAM roles
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
      # Creates IAM role for ALB Ingress Controller
      # Using IRSA (not static keys!)

    - metadata:
        name: cluster-autoscaler
        namespace: kube-system
      wellKnownPolicies:
        autoScaler: true
      # Creates IAM role for Cluster Autoscaler

    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true
      # Creates IAM role for EBS CSI driver

# ── MANAGED NODE GROUPS ──────────────────────────
managedNodeGroups:
  - name: ng-workers-general
    # General purpose workloads
    instanceType: m5.large
    # m5.large: 2 vCPU, 8GB RAM
    # Good balance for most workloads

    minSize: 2
    desiredCapacity: 3
    maxSize: 10
    # min/desired/max for cluster autoscaler

    availabilityZones:
      - us-east-1a
      - us-east-1b
    # Spread nodes across AZs for HA

    labels:
      role: worker
      tier: general
    taints: []
    # Labels: used in pod scheduling (nodeSelector)
    # Taints: repel pods unless they tolerate

    volumeSize: 50
    volumeType: gp3
    volumeEncrypted: true
    # Root volume: 50GB gp3, encrypted

    privateNetworking: true
    # privateNetworking: nodes in PRIVATE subnets
    # ALWAYS true for production!
    # Nodes should never be publicly accessible

    updateConfig:
      maxUnavailable: 1
      # During node group update: 1 node unavailable at a time
      # Rolling node upgrade = minimal disruption

    iam:
      withAddonPolicies:
        imageBuilder: true
        # Allow: pull from ECR
        cloudWatch: true
        # Allow: send logs and metrics
        albIngress: true
        # Allow: ALB Ingress controller
        autoScaler: true
        # Allow: cluster autoscaler

    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/devops-journey: "owned"
      # Tags required by cluster autoscaler!

  - name: ng-workers-spot
    # Spot instances for non-critical / batch
    instanceTypes:
      - m5.large
      - m5a.large
      - m4.large
    # Multiple instance types = better spot availability

    spot: true
    # spot: use spot instances (up to 90% cheaper)
    # Risk: 2-minute notice before termination
    # Use only for: batch, dev, stateless workloads

    minSize: 0
    desiredCapacity: 0
    maxSize: 20
    # Start at 0: only scale when needed

    labels:
      role: spot-worker
      spot: "true"

    taints:
      - key: spot
        value: "true"
        effect: NoSchedule
    # Taint: pods must tolerate 'spot:true:NoSchedule'
    # Prevents critical pods from landing on spot nodes

    privateNetworking: true

# ── ADD-ONS ──────────────────────────────────────
addons:
  - name: vpc-cni
    version: latest
    # VPC CNI: gives pods real VPC IP addresses
    # Each pod = IP in your VPC subnet
    # Enables: VPC security groups on pods

  - name: coredns
    version: latest
    # CoreDNS: DNS for pods
    # service-name.namespace.svc.cluster.local

  - name: kube-proxy
    version: latest
    # kube-proxy: pod-to-pod networking rules

  - name: aws-ebs-csi-driver
    version: latest
    # EBS CSI: provision EBS volumes for StatefulSets
    # StorageClass: gp3 by default
    # Required for: any app needing persistent storage

# ── CLOUDWATCH LOGGING ───────────────────────────
cloudWatch:
  clusterLogging:
    enableTypes:
      - api
      # Log all K8s API server requests
      - audit
      # Security: log all who did what (IMPORTANT!)
      - authenticator
      # Log authentication events
      - controllerManager
      # Log scheduling decisions
      - scheduler
      # Log pod scheduling

